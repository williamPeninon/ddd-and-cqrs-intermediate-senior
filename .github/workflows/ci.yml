name: CI                                          # nom du workflow affiché dans l'onglet "Actions" de GitHub
on:                                                # liste des événements qui déclenchent ce workflow
  push:                                            # se déclenche à chaque push sur n'importe quelle branche
  pull_request:                                    # se déclenche à chaque ouverture/mise à jour d'une pull request

jobs:                                              # liste des jobs exécutés (en parallèle par défaut)

  quality:                                         # job 1 : qualité de code + tests unitaires
    runs-on: ubuntu-latest                         # exécuté sur une VM GitHub Ubuntu à jour
    steps:                                         # liste des étapes du job, exécutées dans l'ordre
      - uses: actions/checkout@v4                  # clone le dépôt dans le runner
      - uses: shivammathur/setup-php@v2            # installe PHP via une action communautaire
        with:                                      # paramètres de l'action setup-php
          php-version: '8.2'                       # version de PHP à installer
          extensions: pdo_pgsql                    # extension PHP nécessaire pour parler à PostgreSQL
          coverage: none                           # désactive Xdebug/PCOV (pas besoin de couverture ici)
      - run: composer install --no-interaction --prefer-dist   # installe les dépendances PHP sans prompt interactif
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff       # vérifie le style de code, affiche le diff sans corriger
      - run: vendor/bin/phpstan analyse src --level=8           # analyse statique du dossier src, niveau de rigueur max
      - run: vendor/bin/phpunit --testsuite Unit                # lance uniquement la suite de tests "Unit"

  bdd-domain:                                      # job 2 : tests comportementaux (BDD) sur la logique métier
    runs-on: ubuntu-latest                         # même type de runner que le job précédent
    steps:                                         # étapes du job
      - uses: actions/checkout@v4                  # clone le dépôt
      - uses: shivammathur/setup-php@v2             # installe PHP
        with:                                      # paramètres de l'action
          php-version: '8.2'                       # version PHP utilisée
          coverage: none                           # pas de couverture de code nécessaire
      - run: composer install --no-interaction --prefer-dist   # installe les dépendances
      - run: vendor/bin/behat --suite=domain        # exécute les scénarios Behat ciblant le domaine (sans I/O externe)

  integration:                                     # job 3 : tests d'intégration avec une vraie base PostgreSQL
    runs-on: ubuntu-latest                         # runner Ubuntu
    services:                                      # services auxiliaires démarrés en conteneur pour ce job
      postgres:                                    # nom du service, utilisé aussi comme hostname réseau interne
        image: postgres:16-alpine                  # image Docker légère de PostgreSQL 16
        env:                                       # variables d'environnement injectées dans le conteneur postgres
          POSTGRES_DB: fleet                       # nom de la base créée au démarrage
          POSTGRES_USER: fleet                     # utilisateur créé au démarrage
          POSTGRES_PASSWORD: fleet                 # mot de passe de cet utilisateur
        ports:                                     # mapping de ports hôte:conteneur
          - 5432:5432                              # expose le port PostgreSQL standard sur le runner
        options: >-                                # options docker supplémentaires (voir note plus bas, non commentables ligne à ligne)
          --health-cmd "pg_isready -U fleet -d fleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:                                            # variables d'environnement disponibles pour toutes les étapes du job
      DATABASE_DSN: pgsql:host=127.0.0.1;port=5432;dbname=fleet   # chaîne de connexion utilisée par l'application
      DATABASE_USER: fleet                          # identifiant DB côté application
      DATABASE_PASSWORD: fleet                      # mot de passe DB côté application
    steps:                                          # étapes du job
      - uses: actions/checkout@v4                   # clone le dépôt
      - uses: shivammathur/setup-php@v2              # installe PHP
        with:                                       # paramètres de l'action
          php-version: '8.2'                        # version PHP utilisée
          extensions: pdo_pgsql                     # extension nécessaire pour la connexion PostgreSQL
          coverage: none                            # pas de couverture de code nécessaire
      - run: composer install --no-interaction --prefer-dist   # installe les dépendances
      - name: Apply database migration               # nom affiché de l'étape dans les logs GitHub
        run: |                                       # bloc shell multiligne (voir note plus bas)
          sudo apt-get update                                                          # met à jour la liste des paquets
          sudo apt-get install -y postgresql-client                                    # installe le client psql sur le runner
          PGPASSWORD=fleet psql -h 127.0.0.1 -U fleet -d fleet -f migrations/001_init.sql  # applique le script SQL initial sur la base
      - run: vendor/bin/phpunit --testsuite Integration   # lance la suite de tests "Integration" (utilise la vraie DB)
      - run: vendor/bin/behat --suite=infra                # lance les scénarios Behat ciblant la couche infra/persistance
